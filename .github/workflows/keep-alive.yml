name: Keep Render awake

# Render's free plan spins a web service down after 15 minutes without
# inbound traffic. Pinging it every 10 minutes keeps the live demo warm.
# One service running 24/7 uses ~744 h/month, within the 750 free hours.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping live demo
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --max-time 120 --retry 3 --retry-delay 10 \
            --write-out "HTTP %{http_code} in %{time_total}s\n" \
            https://superlega-predictor.onrender.com/api/equipos
